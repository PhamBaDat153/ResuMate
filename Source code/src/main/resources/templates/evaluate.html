<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'ResuMate'">ResuMate - Đánh giá CV</title>
    <link rel="icon" type="image/png" th:href="@{/image/logo1.png}" href="../static/image/logo1.png">

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">

    <!-- Roboto Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Cherry Bomb Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Great+Vibes&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light" id="navbar">
            <div class="container">
                <a class="navbar-brand" id="logoText" th:href="@{/}" href="/">
                    <img src="../static/image/logo3.png" th:src="@{/image/logo3.png}" alt="ResuMate" id="logoImg">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item nav-button">
                            <a class="nav-link nav-button" th:href="@{/}" href="/">Trang chủ</a>
                        </li>
                        <li class="nav-item nav-button">
                            <a class="nav-link active" href="#">Đánh giá CV</a>
                        </li>
                        <li class="nav-item nav-button">
                            <a class="nav-link" href="#">Mô phỏng phỏng vấn</a>
                        </li>
                        <li class="nav-item ms-lg-3 dropdown">
                            <a class="btn login-dropdown-btn" href="#" role="button" id="authDropdown"
                               data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <i class="bi bi-person-fill"></i> Tài khoản
                            </a>
                            <div class="dropdown-menu dropdown-menu-end" aria-labelledby="authDropdown">
                                <a class="dropdown-item" th:href="@{/}" href="/">Đăng ký</a>
                                <a class="dropdown-item" th:href="@{/}" href="/">Đăng nhập</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>

    </main>
    <footer>

    </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
